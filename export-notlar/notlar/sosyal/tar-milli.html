<h2>Millî Mücadele</h2><p>Mustafa Kemal 19 Mayıs 1919'da Samsun'a çıktı; Amasya, Erzurum, Sivas ile millî birlik sağlandı. <b>23 Nisan 1920</b> TBMM açıldı. Sakarya ve Büyük Taarruz ile Batı Cephesi kazanıldı; <b>Lozan (1923)</b> bağımsızlığı uluslararası alanda tanıdı.</p>
