<h2>19. Yüzyıl Osmanlı Modernleşmesi</h2><p>II. Mahmut Yeniçeri Ocağı'nı kaldırdı (1826) ve modern ordu kurdu. <b>Tanzimat (1839)</b> ve Islahat Fermanı eşitlik adımlarıydı. <b>I. Meşrutiyet (1876)</b> ile ilk anayasa (Kanun-i Esasi) ve meclis açıldı. Şark Meselesi büyük güçlerin paylaşım planıydı.</p>
